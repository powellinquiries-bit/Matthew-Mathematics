<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Resources | Matthew Mathematics</title>
<style>
  :root {
    --navy: #14284b;
    --navy-dark: #0c1a33;
    --grey: #6b7280;
    --grey-light: #eef0f3;
    --grey-mid: #d5d9df;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: var(--navy-dark); background: var(--grey-light); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 1060px; margin: 0 auto; padding: 0 20px; }

  header { background: var(--navy); color: var(--white); }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 1.35rem; font-weight: 700; letter-spacing: .5px; }
  .logo span { color: var(--grey-mid); font-weight: 400; }
  .nav-right { display: flex; align-items: center; gap: 20px; font-size: .95rem; color: var(--grey-mid); }
  .nav-right a, .nav-right button {
    border: 1px solid var(--grey-mid); padding: 6px 16px; border-radius: 6px; background: none;
    color: var(--grey-mid); font: inherit; cursor: pointer; transition: all .2s;
  }
  .nav-right a:hover, .nav-right button:hover { background: var(--white); color: var(--navy); }

  .top { background: linear-gradient(135deg, var(--navy-dark), var(--navy)); color: var(--white); padding: 44px 0; }
  .top h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.2; }
  .top p { color: var(--grey-mid); margin-top: 6px; }

  .profile { background: var(--white); padding: 40px 0; border-bottom: 1px solid var(--grey-mid); }
  .profile-inner { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .avatar-wrap { text-align: center; }
  .avatar {
    width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--navy);
    box-shadow: 0 4px 16px rgba(20,40,75,.25); object-fit: cover; display: block; margin: 0 auto;
    background: var(--navy); color: var(--white); font-size: 3rem; font-weight: 700;
    align-items: center; justify-content: center;
  }
  div.avatar { display: flex; }
  .profile-info h2 { color: var(--navy); font-size: 2rem; line-height: 1.2; margin-bottom: 10px; }
  .facts { display: flex; gap: 14px; flex-wrap: wrap; }
  .fact { background: var(--grey-light); border-radius: 10px; padding: 10px 20px; min-width: 150px; }
  .fact .label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--grey); font-weight: 600; }
  .fact .value { color: var(--navy); font-weight: 700; font-size: 1.05rem; }
  .section-title { color: var(--navy); font-size: 1.6rem; margin-bottom: 18px; }

  main { padding: 40px 0 70px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .filters button {
    padding: 9px 20px; border-radius: 999px; border: 2px solid var(--navy); background: var(--white);
    color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .filters button:hover { background: var(--grey-mid); }
  .filters button.active { background: var(--navy); color: var(--white); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
  .card {
    background: var(--white); border-radius: 10px; padding: 24px; border-top: 4px solid var(--navy);
    box-shadow: 0 2px 10px rgba(20,40,75,.08); display: flex; flex-direction: column; gap: 8px;
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; font-size: .78rem; font-weight: 600; }
  .tag { background: var(--grey-light); color: var(--navy); padding: 2px 10px; border-radius: 999px; }
  .card h3 { color: var(--navy); font-size: 1.1rem; }
  .card p { color: var(--grey); font-size: .94rem; flex: 1; }
  .open {
    align-self: flex-start; margin-top: 6px; background: var(--navy); color: var(--white);
    padding: 9px 20px; border-radius: 6px; font-weight: 600; font-size: .92rem; transition: background .2s;
  }
  .open:hover { background: var(--navy-dark); }
  .paper-list { background: var(--white); border-radius: 10px; box-shadow: 0 2px 10px rgba(20,40,75,.08); border-top: 4px solid var(--navy); overflow: hidden; }
  .paper-row { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--grey-light); transition: background .15s; }
  .paper-row:last-child { border-bottom: none; }
  .paper-row:hover { background: var(--grey-light); }
  .paper-row .title { flex: 1; font-weight: 600; color: var(--navy); min-width: 0; overflow-wrap: anywhere; }
  .paper-row .tags { flex: none; }
  .paper-row .open { margin: 0; flex: none; padding: 7px 16px; font-size: .88rem; }
  @media (max-width: 640px) {
    .paper-row { flex-wrap: wrap; gap: 8px 12px; padding: 14px 16px; }
    .paper-row .title { flex: 1 1 100%; }
  }
  .filters.sub { margin-top: -8px; }
  .filters.sub button { padding: 6px 16px; font-size: .9rem; border-width: 1.5px; }
  .paper-list.empty { min-height: 180px; }
  .placeholder { background: var(--white); border: 2px dashed var(--grey-mid); border-radius: 10px; min-height: 220px; }

  footer { background: var(--navy-dark); color: var(--grey-mid); text-align: center; padding: 28px 0; font-size: .9rem; }
</style>
<script>
  // Only signed-in clients can see this page. Send everyone else to the home page.
  (function () {
    var user = null;
    try { user = sessionStorage.getItem('mm_user'); } catch (e) {}
    if (!user) { window.location.replace('index.html'); }
  })();
</script>
</head>
<body>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">Matthew <span>Mathematics</span></a>
      <div class="nav-right">
        <a href="resources-af.html" id="lang-btn" lang="af" hreflang="af">Afrikaans</a>
        <button type="button" id="signout">Sign out</button>
      </div>
    </nav>
  </div>
</header>

<div class="top">
  <div class="container">
    <h1>Client Resources</h1>
    <p id="welcome">Welcome back.</p>
  </div>
</div>

<section class="profile">
  <div class="container profile-inner">
    <div class="avatar-wrap">
      <div id="avatar-slot"></div>
    </div>
    <div class="profile-info">
      <h2 id="p-name"></h2>
      <div class="facts">
        <div class="fact"><span class="label">School</span><span class="value" id="p-school"></span></div>
        <div class="fact"><span class="label">Grade</span><span class="value" id="p-grade"></span></div>
      </div>
    </div>
  </div>
</section>

<main>
  <div class="container">
    <h2 class="section-title">Your Resources</h2>
    <div class="filters" id="filters"></div>
    <div class="filters sub" id="subfilters"></div>
    <div class="grid" id="list"></div>
  </div>
</main>

<footer>
  <div class="container">&copy; 2026 Matthew Mathematics. All rights reserved.</div>
</footer>

<script src="data.js"></script>
<script src="papers.js"></script>
<script>
  // Resources, client profiles and logins live in data.js

  var user = '';
  try { user = sessionStorage.getItem('mm_user') || ''; } catch (e) {}
  var profile = CLIENTS[user] || { name: user.charAt(0).toUpperCase() + user.slice(1), school: 'Not set', grade: '' };
  var firstName = String(profile.name || user).split(' ')[0];
  document.getElementById('welcome').textContent = 'Welcome, ' + firstName + '.';
  document.getElementById('p-name').textContent = profile.name || user;
  document.getElementById('p-school').textContent = profile.school || 'Not set';
  document.getElementById('p-grade').textContent = profile.grade ? 'Grade ' + profile.grade : 'Not set';

  // Profile picture: the photo you set for the client, otherwise their initials
  function renderAvatar() {
    var slot = document.getElementById('avatar-slot');
    var src = profile.photo;
    if (src) {
      slot.innerHTML = '<img class="avatar" alt="Profile picture" src="' + esc(src) + '">';
    } else {
      var initials = String(profile.name || user).split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase();
      slot.innerHTML = '<div class="avatar" aria-label="Profile picture">' + esc(initials) + '</div>';
    }
  }

  var TABS = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'pastpapers', label: 'Past Papers' }
  ];
  var current = 'dashboard';
  var paperGroup = 'all';
  var PAPERS = (typeof PAST_PAPERS !== 'undefined') ? PAST_PAPERS : [];

  // Show only the past papers for this client's grade (folder names like "Grade 10" / "Graad 10").
  // If a client has no grade set, all papers are shown.
  var myGrade = parseInt(profile.grade, 10) || 0;
  var gradeLocked = myGrade > 0;
  if (gradeLocked) {
    PAPERS = PAPERS.filter(function (p) {
      var m = String(p.group).match(/\d+/);
      return m && parseInt(m[0], 10) === myGrade;
    });
  }
  var subEl = document.getElementById('subfilters');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderFilters() {
    filtersEl.innerHTML = TABS.map(function (t) {
      return '<button type="button" data-g="' + t.id + '" class="' + (t.id === current ? 'active' : '') + '">' + t.label + '</button>';
    }).join('');
  }

  function renderPapers() {
    var groups = [];
    PAPERS.forEach(function (p) { if (groups.indexOf(p.group) < 0) groups.push(p.group); });
    subEl.innerHTML = gradeLocked ? '' : ['all'].concat(groups).map(function (g) {
      return '<button type="button" data-p="' + esc(g) + '" class="' + (g === paperGroup ? 'active' : '') + '">' + (g === 'all' ? 'All' : esc(g)) + '</button>';
    }).join('');
    var rows = PAPERS.filter(function (p) { return paperGroup === 'all' || p.group === paperGroup; }).map(function (p) {
      return '<div class="paper-row">' +
        '<span class="title">' + esc(p.title) + '</span>' +
        '<span class="tags"><span class="tag">' + esc(p.group) + '</span>' + (p.sub ? '<span class="tag">' + esc(p.sub) + '</span>' : '') + '</span>' +
        '<a class="open" href="' + esc(p.url) + '" target="_blank" rel="noopener">Open / Download</a>' +
        '</div>';
    }).join('');
    listEl.className = 'paper-list';
    listEl.innerHTML = rows;
  }

  function renderList() {
    subEl.innerHTML = '';
    listEl.className = 'grid';
    if (current === 'pastpapers' && PAPERS.length) { renderPapers(); return; }
    // Dashboard: a list in the same format as Past Papers, starting with a welcome line
    var items = RESOURCES.filter(function (r) { return r.category === current; });
    var welcome = current === 'dashboard' ? '<div class="paper-row"><span class="title">Welcome to your Math Academy</span></div>' : '';
    listEl.className = 'paper-list' + (items.length || welcome ? '' : ' empty');
    listEl.innerHTML = welcome + items.map(function (r) {
      var isFile = r.type === 'file';
      return '<div class="paper-row">' +
        '<span class="title">' + esc(r.title) + '</span>' +
        '<span class="tags"><span class="tag">Grade ' + esc(r.grade) + '</span><span class="tag">' + esc(r.topic) + '</span></span>' +
        '<a class="open" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + (isFile ? 'Open / Download' : 'Open link') + '</a>' +
        '</div>';
    }).join('');
  }

  filtersEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    current = b.getAttribute('data-g');
    renderFilters();
    renderList();
  });

  subEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    paperGroup = b.getAttribute('data-p');
    renderList();
  });

  // Sign out: clear the login and go back to the home page
  document.getElementById('signout').addEventListener('click', function () {
    try { sessionStorage.removeItem('mm_user'); } catch (e) {}
    window.location.href = 'index.html';
  });

  renderFilters();
  renderList();
  renderAvatar();
</script>

</body>
</html>
